name: Deploy to Cloudflare

on:
  push:
    branches: 
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm run test -- --coverage
      
      - name: Build 
        run: npm run build

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  
  release:
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare (Dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy dist/practice4/index.js --name practice5-dev --compatibility-date 2026-02-26 --compatibility-flags nodejs_compat --assets dist/client

  deploy-prod:
    needs: release
    runs-on: ubuntu-latest
    # Este nombre de entorno DEBE coincidir con el que crees en GitHub Settings
    environment: production
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare (Prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Cambié el nombre a 'practice5-prod' para diferenciarlo
          command: deploy dist/practice4/index.js --name practice5-prod --compatibility-date 2026-02-26 --compatibility-flags nodejs_compat --assets dist/client